<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TypeStory · 地鼠键盘花园</title><link rel="stylesheet" href="css/main.css"></head>
<body><header><a class="brand" href="#">🌱 TypeStory <small>地鼠键盘花园</small></a><button id="settings-button">⚙ 设置</button></header>
<main><section id="home"><div class="hero"><div><span class="eyebrow">小手指，大冒险</span><h1>让手指记住路，<br>让想法跑起来。</h1><p>跟着地鼠认识键盘，一步一步练习不看键盘打字。</p><p class="gentle">先切换到 ABC / 英文输入源 · 双手轻放在 F 和 J</p></div><img src="assets/images/mole.svg" alt="戴着叶子帽的花园地鼠"></div><div class="cards"><button class="card" data-mode="free"><span>🎹</span><h2>键盘探索</h2><p>随意敲一敲，认识每个键</p><b>自由练习 →</b></button><button class="card" data-mode="mole"><span>🌼</span><h2>地鼠出没</h2><p>找到字符，把地鼠送回家</p><b>一分钟挑战 →</b></button><button class="card" data-mode="phrase"><span>✏️</span><h2>短句小径</h2><p>一步一步，打出完整小句子</p><b>继续练习 →</b></button></div><div class="daily">每天 10–15 分钟：探索热身 → 有提示找键 → 无提示挑战 → 连续输入</div></section>
<section id="play" hidden><div class="play-top"><button id="back">← 花园首页</button><h1 id="mode-title"></h1><div id="caps" hidden>⇪ 大写锁定已开启</div></div><div class="controls"><label id="stage-label">练习阶段 <select id="stage"></select></label><label id="help-label"><input type="checkbox" id="help" checked> 帮助模式</label><button id="start" class="primary">开始练习</button><button id="pause" hidden>暂停</button><button id="hint" hidden>💡 帮帮我</button></div><div class="stats"><span id="score"></span><span id="time"></span><span id="accuracy"></span><span id="progress"></span></div><div id="message" role="status" aria-live="polite">准备好了吗？</div><div id="free-display" hidden><span id="typed">准备出发</span><p id="free-finger">敲下实体键盘，看看是哪根手指的任务</p></div><div id="phrase-board" hidden aria-label="待输入短句"></div><div id="holes" hidden></div><div id="keyboard-area"><div id="keyboard"></div><div id="guidance"></div><div id="hands"></div></div><div id="result" hidden></div></section>
<p id="storage-warning" hidden role="status"></p></main><footer>慢慢来，准确比快更重要。眼睛看屏幕，小手找键位。</footer>
<dialog id="settings"><form method="dialog"><div class="dialog-heading"><h2>花园设置</h2><button aria-label="关闭设置">✕</button></div></form><label>键盘布局 <select id="layout"><option value="mac">美式 MacBook</option><option value="windows">美式 Windows</option></select></label><label>字符尺寸 <select id="size"><option value="standard">标准 · 大字符</option><option value="large">大</option><option value="huge">超大</option></select></label><label>音量 <input id="volume" type="range" min="0" max="100"></label><label><input id="mute" type="checkbox"> 静音</label><hr><h3>短句练习进度</h3><p id="saved-progress"></p><button id="export">导出进度</button><button id="import">导入进度</button><input id="import-file" type="file" accept="application/json,.json" hidden><p id="import-status" role="status"></p><p>数据保存在此 Chrome 中。建议偶尔导出备份。</p></dialog>
<script src="js/keyboard.js"></script><script src="js/lessons.js"></script><script src="js/core.js"></script><script src="js/audio.js"></script><script src="js/app.js"></script></body></html>
